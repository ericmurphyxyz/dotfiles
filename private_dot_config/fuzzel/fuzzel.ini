font=JetBrainsMono Nerd Font:size=15
icons-enabled=no
prompt = ""
dpi-aware = no
use-bold = false
inner-pad = 5
vertical-pad = 22
horizontal-pad = 24
minimal-lines = true

[colors]
background=11111bff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=89b4faff
selection=cba6f7ff
selection-text=1e1e2eff
selection-match=1e1e2eff
counter=7f849cff
border=cba6f7ff

[border]
width=0
radius=0

[key-bindings]
delete-line-forward = none
next = Down Control+j
prev = Up Control+k
next-page = Page_Down Control+f
prev-page = Page_Up Control+b
cursor-left = Left
cursor-right = Right
