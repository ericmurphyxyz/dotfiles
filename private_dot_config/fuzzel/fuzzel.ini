font=JetBrainsMono Nerd Font Mono:size=12
icons-enabled=no
prompt = ""
dpi-aware = no
use-bold = false
inner-pad = 5
vertical-pad = 20
horizontal-pad = 20
minimal-lines = true

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=89b4faff
selection=cba6f7ff
selection-text=1e1e2eff
selection-match=1e1e2eff
counter=7f849cff
border=eba0acff

[border]
width=0
radius=0

[key-bindings]
delete-line-forward = none
next = Down Shift+j
prev = Up Shift+k
next-page = Page_Down Shift+d
prev-page = Page_Up Shift+u
